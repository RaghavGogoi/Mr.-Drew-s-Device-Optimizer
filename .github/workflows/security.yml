name: Security Analysis & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * 1' # Every Monday at 02:30 UTC
  workflow_dispatch:

jobs:
  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'cpp, python'

    - name: Build C++ Target
      run: |
        g++ -O3 -std=c++17 main.cpp -o DeviceOptimizer.exe -static -lpsapi -lwinmm -lpowrprof -lshell32

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  bandit-scan:
    name: Python Security Linting (Bandit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Bandit
      run: |
        python -m pip install bandit

    - name: Run Bandit Security Scanner
      run: |
        bandit -r app.py optimizer_core.py config.py -ll -ii

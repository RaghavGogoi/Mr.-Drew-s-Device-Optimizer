name: Continuous Integration & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Native C++ Kernel Binaries (MinGW g++)
      run: |
        g++ -O3 -std=c++17 main.cpp -o DeviceOptimizer.exe -static -lpsapi -lwinmm -lpowrprof -lshell32
        g++ -DBUILD_DLL -O3 -std=c++17 -shared main.cpp -o device_optimizer.dll -static -lpsapi -lwinmm -lpowrprof -lshell32
        cp DeviceOptimizer.exe main.exe

    - name: Execute Automated Test Suite
      run: |
        python -m unittest discover tests -v

    - name: Verify Standalone C++ Engine Telemetry
      run: |
        .\DeviceOptimizer.exe --sys-specs
        .\DeviceOptimizer.exe --version

  test-linux:
    name: Cross-Platform Core Test (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil pywebview pillow

    - name: Compile C++ Engine on Linux
      run: |
        g++ -O3 -std=c++17 main.cpp -o DeviceOptimizer
        g++ -DBUILD_DLL -O3 -std=c++17 -shared -fPIC main.cpp -o libdevice_optimizer.so

    - name: Run Core Tests on Linux
      run: |
        python3 -m unittest discover tests -v
